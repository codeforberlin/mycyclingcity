{% load i18n %}
<script src="https://cdn.tailwindcss.com"></script>
<style>
  .mc-session-dash {
    --mc-card-bg: #f8fafc;
    --mc-card-active: #ecfdf5;
    --mc-card-border: #cbd5e1;
    --mc-card-active-border: #34d399;
    --mc-kick: #dc2626;
    --mc-start: #059669;
    --mc-add: #2563eb;
    margin: 0 -10px;
    padding: 8px 4px 24px;
  }
  .mc-session-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 1rem;
  }
  @media (min-width: 640px) {
    .mc-session-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (min-width: 1024px) {
    .mc-session-grid { grid-template-columns: repeat(4, 1fr); }
  }
  .mc-session-card {
    background: var(--mc-card-bg);
    border: 2px solid var(--mc-card-border);
    border-radius: 12px;
    padding: 1rem;
    display: flex;
    flex-direction: column;
    min-height: 220px;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .mc-session-card.is-active {
    background: var(--mc-card-active);
    border-color: var(--mc-card-active-border);
  }
  .mc-session-card .mc-label {
    font-size: 1.35rem;
    font-weight: 700;
    line-height: 1.2;
    margin: 0 0 0.25rem;
    word-break: break-word;
  }
  .mc-session-card .mc-sub {
    font-size: 0.85rem;
    color: #64748b;
    margin-bottom: 0.35rem;
  }
  .mc-session-card.is-waiting:not(.is-active) {
    border-color: #f59e0b;
    background: #fffbeb;
  }
  .mc-proxy {
    font-size: 0.78rem;
    font-weight: 600;
    color: #64748b;
    margin: -0.15rem 0 0.45rem;
    min-height: 1.1em;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.35rem;
  }
  .mc-proxy[data-proxy-state="paper"] { color: #047857; }
  .mc-proxy[data-proxy-state="limbo"],
  .mc-proxy.is-waiting { color: #b45309; }
  .mc-proxy[data-proxy-state="offline"] { color: #b91c1c; }
  .mc-proxy[data-proxy-state="other"] { color: #6d28d9; }
  .mc-proxy[data-proxy-state="unknown"] { color: #64748b; }
  .mc-proxy-missing { color: #94a3b8; font-weight: 500; }
  .mc-wait-badge {
    display: inline-block;
    font-size: 0.68rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 0.12rem 0.4rem;
    border-radius: 4px;
    background: #f59e0b;
    color: #fff;
  }
  .mc-session-times {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.35rem 0.5rem;
    font-size: 0.82rem;
    font-weight: 600;
    color: #475569;
    background: #f1f5f9;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    padding: 0.4rem 0.55rem;
    margin-bottom: 0.65rem;
    line-height: 1.3;
  }
  .mc-session-card.is-active .mc-session-times {
    background: #d1fae5;
    border-color: #a7f3d0;
    color: #065f46;
  }
  .mc-session-times.is-custom {
    border-color: #93c5fd;
    background: #eff6ff;
    color: #1e40af;
  }
  .mc-session-card.is-active .mc-session-times.is-custom {
    background: #dbeafe;
    border-color: #93c5fd;
    color: #1e3a8a;
  }
  .mc-custom-badge {
    display: inline-block;
    font-size: 0.68rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    padding: 0.1rem 0.35rem;
    border-radius: 4px;
    background: #2563eb;
    color: #fff;
  }
  .mc-countdown {
    font-size: 2.25rem;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
    color: #065f46;
    line-height: 1;
    margin: 0.5rem 0;
  }
  .mc-status-idle {
    font-size: 1.1rem;
    color: #64748b;
    font-weight: 600;
    margin: 0.75rem 0;
    flex-shrink: 0;
  }
  .mc-status-idle.is-waiting {
    font-size: 1.35rem;
    font-weight: 800;
    color: #9a3412;
    background: #ffedd5;
    border: 1px solid #fb923c;
    border-radius: 8px;
    padding: 0.55rem 0.65rem;
    margin: 0.5rem 0 0.75rem;
    text-align: center;
  }
  .mc-pfand {
    background: #fef3c7;
    border: 1px solid #f59e0b;
    color: #92400e;
    border-radius: 8px;
    padding: 0.5rem 0.65rem;
    font-size: 0.9rem;
    font-weight: 600;
    margin-bottom: 0.75rem;
  }
  .mc-actions {
    margin-top: auto;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }
  .mc-actions-row {
    display: flex;
    gap: 0.5rem;
    align-items: stretch;
  }
  .mc-actions-row form { flex: 1; min-width: 0; }
  .mc-actions-row > .mc-btn {
    flex: 1;
    min-width: 0;
    white-space: nowrap;
  }
  .mc-start-form {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
    width: 100%;
  }
  .mc-spawn-check {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    font-size: 0.85rem;
    font-weight: 600;
    color: #334155;
    cursor: pointer;
    user-select: none;
  }
  .mc-spawn-check input {
    width: 1.1rem;
    height: 1.1rem;
    accent-color: #0f766e;
  }
  .mc-region-select {
    display: block;
    font-size: 0.78rem;
    font-weight: 600;
    color: #334155;
  }
  .mc-start-select {
    width: 100%;
    font-size: 0.8rem;
    padding: 0.25rem 0.35rem;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    background: #fff;
  }
  .mc-ticket-stepper {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.35rem 0.5rem;
    font-size: 0.78rem;
    font-weight: 600;
    color: #334155;
  }
  .mc-ticket-label { white-space: nowrap; }
  .mc-ticket-controls {
    display: inline-flex;
    align-items: center;
    gap: 0.2rem;
  }
  .mc-ticket-btn {
    width: 1.85rem;
    height: 1.85rem;
    border: 1px solid #94a3b8;
    border-radius: 6px;
    background: #fff;
    color: #0f172a;
    font-size: 1.1rem;
    font-weight: 700;
    line-height: 1;
    cursor: pointer;
    padding: 0;
  }
  .mc-ticket-btn:hover:not(:disabled) { background: #f1f5f9; }
  .mc-ticket-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .mc-ticket-input {
    width: 2.75rem;
    height: 1.85rem;
    text-align: center;
    font-size: 0.9rem;
    font-weight: 700;
    border: 1px solid #94a3b8;
    border-radius: 6px;
    padding: 0;
    -moz-appearance: textfield;
  }
  .mc-ticket-input::-webkit-outer-spin-button,
  .mc-ticket-input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  .mc-ticket-cost {
    color: #64748b;
    font-weight: 500;
    min-height: 1em;
  }
  .mc-grant-picker {
    width: 100%;
    margin-top: 0.35rem;
    padding: 0.4rem 0.45rem;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    background: #f8fafc;
    font-size: 0.78rem;
    text-align: left;
  }
  .mc-grant-toggle {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    gap: 0.5rem;
    padding: 0.35rem 0.45rem;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    background: #fff;
    color: #0f172a;
    font: inherit;
    font-weight: 700;
    cursor: pointer;
  }
  .mc-grant-toggle:disabled {
    opacity: 0.55;
    cursor: not-allowed;
  }
  .mc-grant-badge {
    min-width: 1.4rem;
    padding: 0.05rem 0.4rem;
    border-radius: 999px;
    background: #e2e8f0;
    color: #334155;
    font-weight: 700;
    font-size: 0.72rem;
    text-align: center;
  }
  .mc-grant-badge.has-selection {
    background: #0f766e;
    color: #fff;
  }
  .mc-grant-panel {
    margin-top: 0.35rem;
  }
  .mc-grant-filter {
    width: 100%;
    box-sizing: border-box;
    margin-bottom: 0.3rem;
    padding: 0.3rem 0.4rem;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    font: inherit;
  }
  .mc-grant-options {
    max-height: 180px;
    overflow-y: auto;
    padding-right: 0.15rem;
  }
  .mc-grant-option, .mc-grant-clear {
    display: flex;
    align-items: flex-start;
    gap: 0.35rem;
    margin: 0.15rem 0;
    color: #0f172a;
  }
  .mc-grant-option.is-filtered-out {
    display: none;
  }
  .mc-grant-clear {
    margin-top: 0.35rem;
    padding-top: 0.3rem;
    border-top: 1px solid #e2e8f0;
  }
  .mc-grant-hint {
    margin-top: 0.4rem;
    padding: 0.4rem 0.5rem;
    border-radius: 8px;
    background: #fff7ed;
    border: 1px solid #fdba74;
    color: #9a3412;
    font-size: 0.78rem;
    text-align: left;
  }
  .mc-grant-hint-list {
    margin-top: 0.2rem;
    color: #7c2d12;
    font-size: 0.72rem;
  }
  .mc-btn-sm {
    font-size: 0.75rem !important;
    padding: 0.25rem 0.5rem !important;
  }
  .mc-region-select select {
    display: block;
    width: 100%;
    margin-top: 0.2rem;
    padding: 0.35rem 0.4rem;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    background: #fff;
    font-size: 0.8rem;
    font-weight: 600;
    color: #0f172a;
  }
  .mc-region-select select:disabled {
    opacity: 0.55;
    cursor: not-allowed;
  }
  .mc-bulk-start-form {
    display: inline-flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.45rem;
  }
  .mc-btn {
    display: block;
    width: 100%;
    min-height: 52px;
    padding: 0.75rem 1rem;
    font-size: 1.05rem;
    font-weight: 700;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    color: #fff;
    text-align: center;
    white-space: nowrap;
  }
  .mc-btn-start { background: var(--mc-start); }
  .mc-btn-add { background: var(--mc-add); }
  .mc-btn-spectator { background: #7c3aed; color: #fff; }
  .mc-btn-mode {
    background: #64748b;
    font-size: 0.92rem;
    min-height: 44px;
    padding: 0.55rem 0.4rem;
  }
  .mc-btn-mode.is-current {
    background: #0f766e;
    box-shadow: inset 0 0 0 2px #99f6e4;
  }
  .mc-gamemode-row { margin-top: 0.15rem; }
  .mc-btn-kick {
    background: var(--mc-kick);
    margin-top: 0.75rem;
  }
  .mc-btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }
  .mc-session-card.is-busy {
    opacity: 0.85;
    outline: 2px dashed #0f766e;
  }
  .mc-bulk-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.75rem 1rem;
    margin: 0 0 1rem;
    padding: 0.75rem 1rem;
    background: #f1f5f9;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
  }
  .mc-bulk-label {
    font-weight: 700;
    font-size: 0.95rem;
    color: #0f172a;
  }
  .mc-bulk-modes {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
  }
  .mc-bulk-modes .mc-btn {
    min-width: 7rem;
  }
  .mc-bulk-modes .mc-btn-bulk-kick {
    min-width: 8rem;
    background: var(--mc-kick);
  }
  .mc-bulk-modes .mc-btn-bulk-start {
    min-width: 8rem;
  }
  @media (hover: hover) {
    .mc-session-card:hover {
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.08);
    }
    .mc-btn-start:hover:not(:disabled) { background: #047857; }
    .mc-btn-add:hover:not(:disabled) { background: #1d4ed8; }
    .mc-btn-spectator:hover:not(:disabled) { background: #6d28d9; }
    .mc-btn-mode:hover:not(:disabled):not(.is-current) { background: #475569; }
    .mc-btn-kick:hover:not(:disabled) { background: #b91c1c; }
  }
</style>
<script>
(function () {
  function pad(n) { return n < 10 ? '0' + n : String(n); }
  function formatMmSs(total) {
    total = Math.max(0, Math.floor(total || 0));
    var m = Math.floor(total / 60);
    var s = total % 60;
    return pad(m) + ':' + pad(s);
  }

  function syncTicketStepper(wrap, formDisabled) {
    if (!wrap) return;
    var input = wrap.querySelector('[data-ticket-input]');
    var dec = wrap.querySelector('[data-ticket-dec]');
    var inc = wrap.querySelector('[data-ticket-inc]');
    var costEl = wrap.querySelector('[data-ticket-cost]');
    if (!input) return;
    var max = parseInt(wrap.getAttribute('data-ticket-max') || '10', 10);
    var velos = parseInt(wrap.getAttribute('data-ticket-velos') || '100', 10);
    if (!isFinite(max) || max < 1) max = 10;
    if (!isFinite(velos) || velos < 1) velos = 100;
    var n = parseInt(input.value, 10);
    if (!isFinite(n) || n < 0) n = 0;
    n = Math.min(max, Math.floor(n));
    input.value = String(n);
    input.disabled = !!formDisabled;
    if (costEl) {
      costEl.textContent = n > 0 ? (n + ' × ' + velos + ' = ' + (n * velos) + ' Velos') : '';
    }
    if (dec) dec.disabled = !!formDisabled || n <= 0;
    if (inc) inc.disabled = !!formDisabled || n >= max;
  }

  function resetTicketCount(card, formDisabled) {
    if (!card) return;
    card.querySelectorAll('[data-ticket-stepper]').forEach(function (wrap) {
      var input = wrap.querySelector('[data-ticket-input]');
      if (input) input.value = '0';
      syncTicketStepper(wrap, formDisabled);
    });
  }

  function applyPayload(data) {
    if (!data || !data.accounts) return;
    data.accounts.forEach(function (item) {
      var card = document.querySelector('[data-account="' + CSS.escape(item.account_name) + '"]');
      if (!card) return;
      var countdown = card.querySelector('[data-countdown]');
      var statusEl = card.querySelector('[data-status-label]');
      var wasActive = card.classList.contains('is-active');
      var isActive = item.status === 'ACTIVE';
      var isUnlimited = !!item.session_unlimited;
      card.classList.toggle('is-active', isActive);
      card.setAttribute('data-remaining', String(item.remaining_seconds || 0));
      card.setAttribute('data-unlimited', isUnlimited ? '1' : '0');
      if (item.play_gamemode) {
        card.setAttribute('data-play-gamemode', item.play_gamemode);
      }
      if (countdown) {
        if (isActive && isUnlimited) {
          countdown.textContent = '∞';
        } else {
          countdown.textContent = isActive ? formatMmSs(item.remaining_seconds) : '';
        }
        countdown.style.display = isActive ? '' : 'none';
      }
      var waiting = !!item.waiting_in_lobby;
      if (statusEl) {
        statusEl.style.display = isActive ? 'none' : '';
        statusEl.classList.toggle('is-waiting', waiting && !isActive);
        if (!isActive) {
          statusEl.textContent = waiting ? 'Bereit zum Start' : 'Bereit';
        }
      }
      var pfand = card.querySelector('[data-pfand]');
      if (pfand) {
        pfand.style.display = isActive ? '' : 'none';
      }
      var startBtn = card.querySelector('[data-action="start"]');
      var addBtn = card.querySelector('[data-action="add_time"]');
      var kickBtn = card.querySelector('[data-action="kick"]');
      if (startBtn) startBtn.disabled = isActive;
      if (addBtn) addBtn.disabled = !isActive || isUnlimited;
      if (kickBtn) kickBtn.disabled = !isActive;
      card.querySelectorAll('.mc-start-form input[name="teleport_to_spawn"]').forEach(function (cb) {
        cb.disabled = isActive;
      });
      card.querySelectorAll('.mc-start-form [data-grant-toggle], .mc-start-form [data-grant-filter]').forEach(function (el) {
        el.disabled = isActive;
      });
      card.querySelectorAll('.mc-start-form input[name="grant_item"], .mc-start-form input[name="clear_grants"]').forEach(function (cb) {
        cb.disabled = isActive;
      });
      if (isActive) {
        card.querySelectorAll('[data-grant-panel]').forEach(function (panel) {
          panel.hidden = true;
        });
        card.querySelectorAll('[data-grant-toggle]').forEach(function (btn) {
          btn.setAttribute('aria-expanded', 'false');
        });
      }
      card.querySelectorAll('.mc-start-form select[name="spawn_region_id"]').forEach(function (sel) {
        sel.disabled = isActive;
      });
      card.querySelectorAll('.mc-start-form select.mc-start-select').forEach(function (sel) {
        sel.disabled = isActive;
      });
      // Reset ticket count only after kick/end (active→idle); keep count visible during session.
      if (!isActive && wasActive) {
        resetTicketCount(card, false);
      } else {
        card.querySelectorAll('[data-ticket-stepper]').forEach(function (wrap) {
          syncTicketStepper(wrap, isActive);
        });
      }
      card.querySelectorAll('[data-action="set_gamemode"]').forEach(function (btn) {
        btn.disabled = !isActive;
        var mode = btn.getAttribute('data-mode') || '';
        btn.classList.toggle('is-current', isActive && mode === (item.play_gamemode || ''));
      });
      var spectatorBtn = card.querySelector('[data-action="toggle_spectator"]');
      if (spectatorBtn) {
        spectatorBtn.disabled = !isActive;
        if (isActive) {
          var isSpec = item.play_gamemode === 'spectator' || !!item.gamemode_spectator;
          spectatorBtn.textContent = isSpec ? 'Adventure' : 'Spectator';
        }
      }
      var proxyEl = card.querySelector('[data-proxy-status]');
      if (proxyEl) {
        var state = item.proxy_state || '';
        proxyEl.setAttribute('data-proxy-state', state);
        proxyEl.setAttribute('data-waiting', waiting ? '1' : '0');
        proxyEl.classList.toggle('is-waiting', waiting);
        card.classList.toggle('is-waiting', waiting && !isActive);
        var badge = proxyEl.querySelector('.mc-wait-badge');
        if (waiting) {
          if (!badge) {
            badge = document.createElement('span');
            badge.className = 'mc-wait-badge';
            badge.textContent = 'Warteraum';
            proxyEl.insertBefore(badge, proxyEl.firstChild);
          }
        } else if (badge) {
          badge.remove();
        }
        var labelEl = proxyEl.querySelector('[data-proxy-label]');
        if (labelEl) {
          labelEl.textContent = item.proxy_label || '—';
        }
      }
    });
    var activeCount = document.querySelectorAll('.mc-session-card.is-active').length;
    var totalCount = document.querySelectorAll('.mc-session-card').length;
    var idleCount = Math.max(0, totalCount - activeCount);
    document.querySelectorAll('[data-action="set_all_gamemode"], [data-action="kick_all"], [data-action="spawn_all"]').forEach(function (btn) {
      btn.disabled = activeCount === 0;
      if (btn.getAttribute('data-action') !== 'set_all_gamemode') return;
      var mode = btn.getAttribute('data-mode') || '';
      // Highlight bulk button if all active cards share that mode
      var allMatch = activeCount > 0;
      document.querySelectorAll('.mc-session-card.is-active').forEach(function (card) {
        if ((card.getAttribute('data-play-gamemode') || '') !== mode) {
          allMatch = false;
        }
      });
      btn.classList.toggle('is-current', allMatch && !!mode);
    });
    document.querySelectorAll('[data-action="start_all"]').forEach(function (btn) {
      btn.disabled = idleCount === 0;
    });
  }

  function tickLocal() {
    document.querySelectorAll('.mc-session-card.is-active[data-remaining]').forEach(function (card) {
      if (card.getAttribute('data-unlimited') === '1') {
        var unlimitedCd = card.querySelector('[data-countdown]');
        if (unlimitedCd) {
          unlimitedCd.textContent = '∞';
        }
        return;
      }
      var remaining = parseInt(card.getAttribute('data-remaining') || '0', 10);
      if (remaining > 0) {
        remaining -= 1;
        card.setAttribute('data-remaining', String(remaining));
      }
      var countdown = card.querySelector('[data-countdown]');
      if (countdown) {
        countdown.textContent = formatMmSs(remaining);
      }
    });
  }

  function poll() {
    var url = document.body.getAttribute('data-session-poll-url');
    if (!url) return;
    fetch(url, { credentials: 'same-origin', headers: { 'Accept': 'application/json' } })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (data) { if (data) applyPayload(data); })
      .catch(function () { /* ignore transient poll errors */ });
  }

  var fastPollUntil = 0;

  function markFastPoll(seconds) {
    fastPollUntil = Date.now() + Math.max(0, (seconds || 0) * 1000);
  }

  function proxyPresencePollMs() {
    var raw = parseInt(document.body.getAttribute('data-proxy-presence-poll-seconds') || '10', 10);
    if (!isFinite(raw) || raw < 2) {
      raw = 10;
    }
    return raw * 1000;
  }

  function proxyPresencePollFastMs() {
    var raw = parseInt(document.body.getAttribute('data-proxy-presence-poll-fast-seconds') || '2', 10);
    if (!isFinite(raw) || raw < 1) {
      raw = 2;
    }
    return Math.min(raw * 1000, proxyPresencePollMs());
  }

  function currentPollMs() {
    if (Date.now() < fastPollUntil) {
      return proxyPresencePollFastMs();
    }
    if (document.querySelector('[data-proxy-status][data-waiting="1"]')) {
      return proxyPresencePollFastMs();
    }
    return proxyPresencePollMs();
  }

  function schedulePoll() {
    poll();
    window.setTimeout(schedulePoll, currentPollMs());
  }

  function csrfToken() {
    // Prefer cookie: must match what Django validates against (stale form tokens cause CSRF 403/500).
    var match = document.cookie.match(/(?:^|;\s*)csrftoken=([^;]+)/);
    if (match) return decodeURIComponent(match[1]);
    var el = document.querySelector('[name=csrfmiddlewaretoken]');
    return el ? el.value : '';
  }

  function buildPostBody(form) {
    var fd = new FormData(form);
    var token = csrfToken();
    if (token) {
      fd.set('csrfmiddlewaretoken', token);
    }
    return fd;
  }

  function nonJsonErrorMessage(status, bodyText) {
    var text = (bodyText || '').toLowerCase();
    if (status === 403) {
      return 'CSRF/Berechtigung fehlgeschlagen (HTTP 403). Bitte Seite neu laden.';
    }
    if (status === 401 || status === 302 || status === 301) {
      return 'Sitzung abgelaufen oder keine Berechtigung. Bitte neu einloggen.';
    }
    if (status === 502 || status === 504) {
      return 'Proxy-/Gateway-Timeout (HTTP ' + status + '). Bitte erneut versuchen.';
    }
    if (text.indexOf('csrf') >= 0) {
      return 'CSRF-Prüfung fehlgeschlagen. Bitte Seite neu laden.';
    }
    if (text.indexOf('login') >= 0 || text.indexOf('anmelden') >= 0) {
      return 'Sitzung abgelaufen. Bitte neu einloggen.';
    }
    return 'Ungültige Server-Antwort (kein JSON, HTTP ' + status + ').';
  }

  function parseActionResponse(r) {
    if (r.type === 'opaqueredirect' || (r.status >= 300 && r.status < 400)) {
      return Promise.resolve({
        httpOk: false,
        data: { message: 'Sitzung abgelaufen oder Weiterleitung. Bitte neu einloggen / Seite neu laden.' }
      });
    }
    var ct = (r.headers.get('content-type') || '').toLowerCase();
    if (ct.indexOf('application/json') >= 0) {
      return r.json().then(function (data) {
        return { httpOk: r.ok, data: data };
      }).catch(function () {
        return { httpOk: false, data: { message: nonJsonErrorMessage(r.status, '') } };
      });
    }
    return r.text().then(function (bodyText) {
      return {
        httpOk: false,
        data: { message: nonJsonErrorMessage(r.status, bodyText) }
      };
    });
  }

  function bindAjaxForms() {
    document.querySelectorAll('.mc-session-dash form').forEach(function (form) {
      form.addEventListener('submit', function (ev) {
        ev.preventDefault();
        var actionInput = form.querySelector('[name="action"]');
        var accountInput = form.querySelector('[name="account"]');
        var action = actionInput ? actionInput.value : '';
        var account = accountInput ? accountInput.value : '';
        var card = form.closest('.mc-session-card');
        var submitBtn = ev.submitter || form.querySelector('button[type="submit"]');
        // Start may live outside the form via HTML form= attribute.
        if ((!submitBtn || !submitBtn.matches('[data-action="start"]')) && action === 'start' && card) {
          submitBtn = card.querySelector('[data-action="start"]') || submitBtn;
        }
        if (submitBtn) submitBtn.disabled = true;

        if (action === 'kick_all') {
          var nActive = document.querySelectorAll('.mc-session-card.is-active').length;
          if (!window.confirm('Wirklich alle ' + nActive + ' aktiven Session(s) beenden?')) {
            if (submitBtn) submitBtn.disabled = false;
            return;
          }
        }
        if (action === 'spawn_all') {
          var nSpawn = document.querySelectorAll('.mc-session-card.is-active').length;
          if (!window.confirm('Alle ' + nSpawn + ' aktiven Spieler zum Welt-Spawn teleportieren?')) {
            if (submitBtn) submitBtn.disabled = false;
            return;
          }
        }
        if (action === 'start_all') {
          var nWaiting = document.querySelectorAll('.mc-session-card.is-waiting:not(.is-active)').length;
          var nIdle = 0;
          document.querySelectorAll('.mc-session-card').forEach(function (c) {
            if (!c.classList.contains('is-active')) nIdle += 1;
          });
          var nStart = nWaiting > 0 ? nWaiting : nIdle;
          var confirmMsg = nWaiting > 0
            ? ('Wirklich alle ' + nStart + ' wartenden Session(s) starten?')
            : ('Wirklich alle ' + nStart + ' idle Session(s) starten?');
          if (!window.confirm(confirmMsg)) {
            if (submitBtn) submitBtn.disabled = false;
            return;
          }
        }

        // Snapshot form fields BEFORE optimistic UI disables inputs
        // (FormData omits disabled controls — would drop ticket_count).
        var postBody = buildPostBody(form);

        // Optimistic UI: reflect the intended state immediately while the request runs.
        if (card && account) {
          if (action === 'start') {
            card.classList.add('is-busy', 'is-active');
            var statusEl = card.querySelector('[data-status-label]');
            if (statusEl) {
              statusEl.style.display = 'none';
            }
            var countdown = card.querySelector('[data-countdown]');
            if (countdown) {
              countdown.style.display = '';
              countdown.textContent = card.getAttribute('data-unlimited') === '1' ? '∞' : '…';
            }
            card.querySelectorAll('button').forEach(function (btn) { btn.disabled = true; });
            // Keep ticket count visible during the session; sync disabled state only.
            card.querySelectorAll('[data-ticket-stepper]').forEach(function (wrap) {
              syncTicketStepper(wrap, true);
            });
            markFastPoll(60);
          } else if (action === 'kick') {
            card.classList.add('is-busy');
            card.classList.remove('is-active');
            var kickCountdown = card.querySelector('[data-countdown]');
            if (kickCountdown) {
              kickCountdown.style.display = 'none';
              kickCountdown.textContent = '';
            }
            var kickStatus = card.querySelector('[data-status-label]');
            if (kickStatus) {
              kickStatus.style.display = '';
              kickStatus.textContent = 'Beende…';
            }
            resetTicketCount(card, false);
          } else if (action === 'add_time') {
            card.classList.add('is-busy');
          } else if (action === 'toggle_spectator' || action === 'set_gamemode') {
            card.classList.add('is-busy');
          }
        }
        if (action === 'set_all_gamemode') {
          var bulkModeInput = form.querySelector('[name="mode"]');
          var bulkMode = bulkModeInput ? bulkModeInput.value : '';
          document.querySelectorAll('.mc-session-card.is-active').forEach(function (activeCard) {
            activeCard.classList.add('is-busy');
            if (bulkMode) {
              activeCard.setAttribute('data-play-gamemode', bulkMode);
              activeCard.querySelectorAll('[data-action="set_gamemode"]').forEach(function (btn) {
                btn.classList.toggle('is-current', btn.getAttribute('data-mode') === bulkMode);
              });
              var specBtn = activeCard.querySelector('[data-action="toggle_spectator"]');
              if (specBtn) {
                specBtn.textContent = bulkMode === 'spectator' ? 'Adventure' : 'Spectator';
              }
            }
          });
          form.querySelectorAll('button').forEach(function (btn) { btn.disabled = true; });
        }
        if (action === 'kick_all') {
          document.querySelectorAll('.mc-session-card.is-active').forEach(function (activeCard) {
            activeCard.classList.add('is-busy');
            activeCard.classList.remove('is-active');
            var cd = activeCard.querySelector('[data-countdown]');
            if (cd) {
              cd.style.display = 'none';
              cd.textContent = '';
            }
            var st = activeCard.querySelector('[data-status-label]');
            if (st) {
              st.style.display = '';
              st.textContent = 'Beende…';
            }
            resetTicketCount(activeCard, false);
          });
          form.querySelectorAll('button').forEach(function (btn) { btn.disabled = true; });
        }
        if (action === 'start_all') {
          var waitingCards = document.querySelectorAll('.mc-session-card.is-waiting:not(.is-active)');
          var targets = waitingCards.length
            ? waitingCards
            : document.querySelectorAll('.mc-session-card:not(.is-active)');
          targets.forEach(function (idleCard) {
            idleCard.classList.add('is-busy', 'is-active');
            var statusEl = idleCard.querySelector('[data-status-label]');
            if (statusEl) {
              statusEl.style.display = 'none';
            }
            var countdown = idleCard.querySelector('[data-countdown]');
            if (countdown) {
              countdown.style.display = '';
              countdown.textContent = '…';
            }
            idleCard.querySelectorAll('button').forEach(function (btn) { btn.disabled = true; });
            idleCard.querySelectorAll('[data-ticket-stepper]').forEach(function (wrap) {
              syncTicketStepper(wrap, true);
            });
          });
          form.querySelectorAll('button').forEach(function (btn) { btn.disabled = true; });
          markFastPoll(60);
        }

        fetch(window.location.pathname + (window.location.pathname.indexOf('?') >= 0 ? '&' : '?') + 'format=json', {
          method: 'POST',
          credentials: 'same-origin',
          redirect: 'manual',
          headers: {
            'Accept': 'application/json',
            'X-Requested-With': 'XMLHttpRequest',
            'X-CSRFToken': csrfToken()
          },
          body: postBody
        })
          .then(parseActionResponse)
          .then(function (result) {
            var data = result.data || {};
            if (result.httpOk && (action === 'clear_grants' || action === 'repair_vehicle')) {
              window.location.reload();
              return;
            }
            if (data.accounts) {
              applyPayload(data);
            }
            if ((action === 'start' || action === 'start_all') && result.httpOk) {
              markFastPoll(60);
            }
            if (!result.httpOk && data.message) {
              window.alert(data.message);
              if (action === 'start' && card) {
                card.classList.remove('is-active', 'is-busy');
                var startBtn = card.querySelector('[data-action="start"]');
                if (startBtn) startBtn.disabled = false;
              } else if (submitBtn) {
                submitBtn.disabled = false;
              }
            }
            if (card) {
              card.classList.remove('is-busy');
            }
            document.querySelectorAll('.mc-session-card.is-busy').forEach(function (busyCard) {
              busyCard.classList.remove('is-busy');
            });
            var activeN = document.querySelectorAll('.mc-session-card.is-active').length;
            var totalN = document.querySelectorAll('.mc-session-card').length;
            var idleN = Math.max(0, totalN - activeN);
            document.querySelectorAll('[data-action="set_all_gamemode"], [data-action="kick_all"], [data-action="spawn_all"]').forEach(function (btn) {
              btn.disabled = activeN === 0;
            });
            document.querySelectorAll('[data-action="start_all"]').forEach(function (btn) {
              btn.disabled = idleN === 0;
            });
          })
          .catch(function () {
            if (card) card.classList.remove('is-busy');
            document.querySelectorAll('.mc-session-card.is-busy').forEach(function (busyCard) {
              busyCard.classList.remove('is-busy');
            });
            window.alert('Aktion fehlgeschlagen (Netzwerk/Timeout). Bitte Seite neu laden.');
            if (submitBtn) submitBtn.disabled = false;
            var activeN = document.querySelectorAll('.mc-session-card.is-active').length;
            var totalN = document.querySelectorAll('.mc-session-card').length;
            var idleN = Math.max(0, totalN - activeN);
            document.querySelectorAll('[data-action="set_all_gamemode"], [data-action="kick_all"], [data-action="spawn_all"]').forEach(function (btn) {
              btn.disabled = activeN === 0;
            });
            document.querySelectorAll('[data-action="start_all"]').forEach(function (btn) {
              btn.disabled = idleN === 0;
            });
          });
      });
    });
  }

  function bindGrantPickers() {
    function syncBadge(picker) {
      var n = picker.querySelectorAll('[data-grant-cb]:checked').length;
      var badge = picker.querySelector('[data-grant-badge]');
      if (!badge) return;
      badge.textContent = String(n);
      badge.classList.toggle('has-selection', n > 0);
      badge.title = n === 1 ? '1 ausgewählt' : (n + ' ausgewählt');
    }

    document.querySelectorAll('[data-grant-picker]').forEach(function (picker) {
      var toggle = picker.querySelector('[data-grant-toggle]');
      var panel = picker.querySelector('[data-grant-panel]');
      var filter = picker.querySelector('[data-grant-filter]');
      if (toggle && panel) {
        toggle.addEventListener('click', function () {
          if (toggle.disabled) return;
          var open = panel.hidden;
          panel.hidden = !open;
          toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
          if (open && filter) {
            try { filter.focus(); } catch (e) {}
          }
        });
      }
      if (filter) {
        filter.addEventListener('input', function () {
          var q = (filter.value || '').trim().toLowerCase();
          picker.querySelectorAll('[data-grant-label]').forEach(function (label) {
            var hay = label.getAttribute('data-filter') || '';
            label.classList.toggle('is-filtered-out', q && hay.indexOf(q) < 0);
          });
        });
      }
      picker.querySelectorAll('[data-grant-cb]').forEach(function (cb) {
        cb.addEventListener('change', function () { syncBadge(picker); });
      });
      syncBadge(picker);
    });
  }

  function bindTicketSteppers() {
    document.querySelectorAll('[data-ticket-stepper]').forEach(function (wrap) {
      var input = wrap.querySelector('[data-ticket-input]');
      var dec = wrap.querySelector('[data-ticket-dec]');
      var inc = wrap.querySelector('[data-ticket-inc]');
      if (!input) return;
      var max = parseInt(wrap.getAttribute('data-ticket-max') || '10', 10);
      if (!isFinite(max) || max < 1) max = 10;

      function clamp(n) {
        if (!isFinite(n) || n < 0) return 0;
        return Math.min(max, Math.floor(n));
      }

      if (dec) {
        dec.addEventListener('click', function () {
          if (input.disabled) return;
          input.value = String(clamp((parseInt(input.value, 10) || 0) - 1));
          syncTicketStepper(wrap, false);
        });
      }
      if (inc) {
        inc.addEventListener('click', function () {
          if (input.disabled) return;
          input.value = String(clamp((parseInt(input.value, 10) || 0) + 1));
          syncTicketStepper(wrap, false);
        });
      }
      input.addEventListener('change', function () { syncTicketStepper(wrap, !!input.disabled); });
      input.addEventListener('input', function () { syncTicketStepper(wrap, !!input.disabled); });
      syncTicketStepper(wrap, !!input.disabled);
    });
  }

  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('.mc-session-card[data-remaining]').forEach(function (card) {
      var countdown = card.querySelector('[data-countdown]');
      if (countdown && card.classList.contains('is-active')) {
        if (card.getAttribute('data-unlimited') === '1') {
          countdown.textContent = '∞';
        } else {
          countdown.textContent = formatMmSs(parseInt(card.getAttribute('data-remaining') || '0', 10));
        }
      }
    });
    // Bau-Kachel: Region-Select und Welt-Spawn-Checkbox schließen sich aus.
    document.querySelectorAll('.mc-start-form').forEach(function (form) {
      var worldCb = form.querySelector('[data-spawn-world]');
      var regionSel = form.querySelector('[data-spawn-region]');
      if (!worldCb || !regionSel) return;
      worldCb.addEventListener('change', function () {
        if (worldCb.checked) {
          regionSel.value = '';
        }
      });
      regionSel.addEventListener('change', function () {
        if (regionSel.value) {
          worldCb.checked = false;
        }
      });
    });
    bindTicketSteppers();
    bindGrantPickers();
    if (document.querySelector('.mc-session-card.is-active') ||
        document.querySelector('[data-proxy-status][data-waiting="1"]')) {
      markFastPoll(60);
    }
    setInterval(tickLocal, 1000);
    bindAjaxForms();
    schedulePoll();
    setTimeout(function () { location.reload(); }, 120000);
  });
})();
</script>
