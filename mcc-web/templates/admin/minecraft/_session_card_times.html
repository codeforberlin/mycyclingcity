{% load i18n %}
<div class="mc-session-times{% if card.uses_custom_settings %} is-custom{% endif %}">
    <span class="mc-session-times-label">
        {% blocktrans with duration=card.start_minutes %}
        Dauer {{ duration }} Min.
        {% endblocktrans %}
    </span>
    {% if card.uses_custom_settings %}
    <span class="mc-custom-badge">{% trans 'Individuell' %}</span>
    {% endif %}
</div>
