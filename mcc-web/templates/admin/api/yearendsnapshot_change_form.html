{% extends "admin/change_form.html" %}
{% load i18n %}

{% block object-tools-items %}
    {{ block.super }}
    {% if is_superuser and undo_url and not original.is_undone %}
    <li>
        <a href="{{ undo_url }}" class="deletelink" style="background:#c62828;">
            {% trans "Jahresabschluss rückgängig machen" %}
        </a>
    </li>
    {% endif %}
{% endblock %}
