# Luanti config for worlds/mycyclingcity_prod (gameid=mycyclingcity).
# Base policy matches minetest.conf; no Mineclonia-only settings.
# Usage:
#   MCC_LUANTI_WORLD=mycyclingcity_prod \
#   MCC_LUANTI_CONFIG=/data/appl/mcc/mcc-web/scripts/minetest_prod.conf \
#   /data/appl/mcc/mcc-web/scripts/luanti_server.sh restart

name = admin
server_name = MyCyclingCity (Prod)
server_description = MCC Zielwelt nach Mineclonia-Umbau

mg_name = singlenode
mgflat_ground_level = 0
water_level = 0
static_spawnpoint = 0, 2, 0

port = 30000
bind_address = 0.0.0.0
max_users = 50
server_announce = false
disallow_empty_password = true

secure.http_mods = mcc_bridge
mcc_bridge.base_url = http://127.0.0.1:8001
mcc_bridge.server_id = luanti-1
mcc_bridge.shared_secret = SECRET
mcc_bridge.heartbeat_seconds = 5
mcc_bridge.debug = session,shop

enable_damage = false
secure.enable_security = false

worldedit.limit = 1000000
worldedit.max_blocks = 2000000

# Void: singlenode fills with air unless overridden per-world
singlenode_fill_with = air